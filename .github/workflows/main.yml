name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install ClawHub CLI
        run: |
          npm install -g npm
          npx clawhub@latest --help

      - name: Install Verified Agent Identity
        run: |
          npx clawhub@latest install verified-agent-identity

      - name: Install Dependencies
        run: |
          if [ -d "scripts" ]; then
            cd scripts
            npm install
          fi

      - name: Create Ethereum Identity
        run: |
          if [ -f "scripts/createNewEthereumIdentity.js" ]; then
            node scripts/createNewEthereumIdentity.js
          fi

      - name: Link Human to Agent
        run: |
          if [ -f "scripts/linkHumanToAgent.js" ]; then
            node scripts/linkHumanToAgent.js
          fi
